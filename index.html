    <style>
    @keyframes pulseBlink {
        0% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.6); }
        50% { opacity: 0.4; transform: scale(1.35); box-shadow: 0 0 14px 4px rgba(0, 0, 0, 0.4); }
        100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.6); }
    }
    .pie-marker {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #FFFFFF;
        box-shadow: 0 0 6px rgba(0,0,0,0.45);
        opacity: 1;
        cursor: pointer;
        transition: transform 0.2s ease;
    }
    .pie-marker.pulsing {
        animation: pulseBlink 1.8s infinite ease-in-out;
        z-index: 9999 !important;
    }
    </style>
    <script>
    document.addEventListener('click', function(e) {
        var marker = e.target.closest('.pie-marker');
        if (marker) {
            // Remove pulse from all markers
            document.querySelectorAll('.pie-marker').forEach(function(el) {
                el.classList.remove('pulsing');
            });
            // Add pulse only to the clicked marker
            marker.classList.add('pulsing');
        }
    });
    </script>
