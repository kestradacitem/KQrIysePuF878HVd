    <style>
    .pie-marker {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #FFFFFF;
        box-shadow: 0 0 6px rgba(0,0,0,0.45);
        cursor: pointer;
        opacity: 0.95;
        transition: transform 0.2s ease-in-out;
    }

    /* 3-pulse animation for active marker */
    @keyframes triplePulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(1.4); box-shadow: 0 0 12px rgba(0,0,0,0.7); }
        100% { opacity: 1; transform: scale(1); }
    }

    .pie-marker.pulsing {
        animation: triplePulse 0.6s ease-in-out 3;
        z-index: 999999 !important;
    }
    </style>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        function initRandomBlinking() {
            var markers = document.querySelectorAll('.pie-marker');
            if (markers.length === 0) {
                setTimeout(initRandomBlinking, 300);
                return;
            }

            var lastIndex = -1;

            function blinkRandomMarker() {
                // Clear pulsing from previous marker
                markers.forEach(m => m.classList.remove('pulsing'));

                // Pick a new random marker index (ensuring no back-to-back duplicate)
                var randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * markers.length);
                } while (randomIndex === lastIndex && markers.length > 1);

                lastIndex = randomIndex;
                var selectedMarker = markers[randomIndex];

                // Trigger pulse
                selectedMarker.classList.add('pulsing');

                // 3 pulses @ 0.6s each = 1.8s (1800ms) total duration before selecting next
                setTimeout(blinkRandomMarker, 1800);
            }

            blinkRandomMarker();
        }

        setTimeout(initRandomBlinking, 800);
    });
    </script>
